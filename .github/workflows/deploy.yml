# ─── Autonomous OS — CI/CD GitHub Actions ───────────────────────
# Runs on your Windows self-hosted runner (FREE, zero GitHub minutes used)

name: Deploy Autonomous OS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────
  # Job 1: Lint & Build Frontend & Backend
  # ────────────────────────────────────────────
  lint-and-build:
    name: Lint & Build
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

  # ────────────────────────────────────────────
  # Job 2: Deploy Flask to AWS Lambda via CDK
  # ────────────────────────────────────────────
  deploy-backend:
    name: Deploy to AWS Lambda (CDK)
    runs-on: self-hosted
    needs: lint-and-build
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CDK Python Dependencies
        working-directory: infra
        run: |
          pip install -r requirements.txt

      - name: Set AWS Environment & Deploy CDK Stack
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          if ("${{ secrets.AWS_ACCESS_KEY_ID }}" -ne "") {
            Write-Host "Deploying AWS CDK Stack..."
            cdk deploy AutonomousOsStack --require-approval never --outputs-file cdk-outputs.json -c account=${{ secrets.AWS_ACCOUNT_ID }} -c region=${{ secrets.AWS_REGION || 'ap-south-1' }}
          } else {
            Write-Host "AWS secrets not configured yet. Skipping CDK deployment."
          }
